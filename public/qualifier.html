<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DFY Qualifier · Test chat</title>
<style>
  :root { --forest:#15514B; --lime:#73CF6F; --bg:#EEF3F0; --ink:#1B3A36; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0E3A35; }
  .wrap { max-width: 460px; margin: 0 auto; height: 100dvh; display:flex; flex-direction:column; background: var(--bg); }
  header { background: var(--forest); color:#EAF6E4; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display:flex; align-items:center; gap:11px; flex-shrink:0; }
  .av { width:38px; height:38px; border-radius:50%; background:var(--lime); color:#0E3A35; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  header .t { font-weight:700; font-size:15px; line-height:1.1; }
  header .s { font-size:11.5px; color:#A9E0A0; margin-top:2px; }
  .badge { margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.06em; background:rgba(255,255,255,.14); padding:3px 8px; border-radius:999px; }
  main { flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; }
  .row.out { justify-content:flex-end; }
  .b { max-width:80%; padding:9px 12px; border-radius:13px; font-size:14px; line-height:1.45; white-space:pre-wrap; box-shadow:0 1px 1px rgba(14,58,53,.06); }
  .row.in  .b { background:#fff; color:var(--ink); border-bottom-left-radius:4px; }
  .row.out .b { background:var(--forest); color:#EAF6E4; border-bottom-right-radius:4px; }
  .note { text-align:center; font-size:12px; color:rgba(21,81,75,.6); padding:6px 20px; }
  .note.err { color:#B0432F; }
  .typing { display:inline-flex; gap:4px; padding:11px 13px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:rgba(21,81,75,.35); animation:bl 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.2s } .typing i:nth-child(3){ animation-delay:.4s }
  @keyframes bl { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
  footer { flex-shrink:0; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); background:var(--bg); display:flex; gap:8px; border-top:1px solid rgba(21,81,75,.1); }
  input.msg { flex:1; border:1px solid rgba(21,81,75,.18); border-radius:999px; padding:11px 15px; font-size:14px; outline:none; font-family:inherit; background:#fff; color:var(--ink); }
  button.send { border:none; background:var(--lime); color:#0E3A35; font-weight:800; border-radius:999px; padding:0 18px; font-size:14px; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  /* Start screen */
  .start { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .start h1 { font-size:19px; color:var(--forest); margin:0; }
  .start p { font-size:13.5px; color:rgba(21,81,75,.65); margin:0; max-width:320px; line-height:1.5; }
  .start input { border:1px solid rgba(21,81,75,.2); border-radius:10px; padding:11px 14px; font-size:14px; width:220px; text-align:center; font-family:inherit; outline:none; }
  .start button { border:none; background:var(--forest); color:#EAF6E4; font-weight:800; border-radius:11px; padding:12px 26px; font-size:14px; cursor:pointer; }
  .hint { font-size:11px; color:rgba(21,81,75,.45); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="av">DFY</div>
    <div><div class="t">Done For You</div><div class="s" id="sub">Lead qualifier · test</div></div>
    <div class="badge" id="badge">TEST</div>
  </header>

  <main id="main">
    <div class="start" id="start">
      <h1>Try the lead qualifier</h1>
      <p>This is a safe test chat. Play the part of a new lead who just tapped your WhatsApp ad. The assistant asks a few questions, then hands off to your team.</p>
      <input id="name" placeholder="Your name (optional)" autocomplete="off" />
      <button id="go">Start chat</button>
      <div class="hint">No real WhatsApp messages are sent.</div>
    </div>
  </main>

  <footer id="footer" style="display:none">
    <input class="msg" id="msg" placeholder="Type a message" autocomplete="off" />
    <button class="send" id="send">Send</button>
  </footer>
</div>

<script>
  const FN = "https://rkmngnkgesteohigvsxe.supabase.co/functions/v1/ai-qualify";
  const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrbW5nbmtnZXN0ZW9oaWd2c3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzODg3NDUsImV4cCI6MjA5Nzk2NDc0NX0._bHtfip6tICiAn3ynE8v3n2GHK9qj4XH01Of-ORcUNc";

  const main = document.getElementById('main');
  const footer = document.getElementById('footer');
  const msgEl = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  let history = [];         // {role, content}
  let name = "there";
  let done = false;
  let busy = false;

  function bubble(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'out' : 'in');
    const b = document.createElement('div');
    b.className = 'b'; b.textContent = text;
    row.appendChild(b); main.appendChild(row);
    main.scrollTop = main.scrollHeight;
    return row;
  }
  function note(text, err) {
    const n = document.createElement('div');
    n.className = 'note' + (err ? ' err' : '');
    n.textContent = text; main.appendChild(n); main.scrollTop = main.scrollHeight;
  }
  function typing() {
    const row = document.createElement('div'); row.className = 'row in';
    row.innerHTML = '<div class="b"><span class="typing"><i></i><i></i><i></i></span></div>';
    main.appendChild(row); main.scrollTop = main.scrollHeight; return row;
  }

  async function ask() {
    if (busy || done) return;
    busy = true; sendBtn.disabled = true;
    const t = typing();
    try {
      const r = await fetch(FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY },
        body: JSON.stringify({ messages: history, name }),
      });
      const data = await r.json();
      t.remove();
      if (!r.ok || data.error) {
        note(data.error === 'ANTHROPIC_API_KEY not configured'
          ? 'Almost there. Add your ANTHROPIC_API_KEY in Supabase to switch the assistant on.'
          : ('Error: ' + (data.error || r.status)), true);
        busy = false; sendBtn.disabled = false; return;
      }
      history.push({ role: 'assistant', content: data.reply });
      bubble('assistant', data.reply);
      if (data.done) {
        done = true;
        document.getElementById('badge').textContent = 'QUALIFIED';
        document.getElementById('sub').textContent = 'Handed to the team';
        note('Lead qualified. In the live version, this chat is now assigned to you and the Meta conversion event fires.');
        msgEl.disabled = true; msgEl.placeholder = 'Chat handed over';
      }
    } catch (e) {
      t.remove(); note('Network error. Please try again.', true);
    }
    busy = false; sendBtn.disabled = false; msgEl.focus();
  }

  function send() {
    const text = msgEl.value.trim();
    if (!text || busy || done) return;
    msgEl.value = '';
    history.push({ role: 'user', content: text });
    bubble('user', text);
    ask();
  }

  sendBtn.addEventListener('click', send);
  msgEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  document.getElementById('go').addEventListener('click', () => {
    const n = document.getElementById('name').value.trim();
    if (n) name = n.slice(0, 60);
    document.getElementById('start').remove();
    footer.style.display = 'flex';
    // The lead speaks first — seed a hello so the assistant greets and asks Q1.
    history.push({ role: 'user', content: 'Hi' });
    bubble('user', 'Hi');
    ask();
    msgEl.focus();
  });
  document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
</script>
</body>
</html>
